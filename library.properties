name=EspBleLink
version=0.1.0
author=konder
maintainer=konder
sentence=BLE peripheral link layer for ESP32 (Nordic UART Service), plus WiFi-mode OTA.
paragraph=Delimiter-framed messaging over NUS with a lock-free RX ring buffer, MTU-aware notify chunking, and overflow diagnostics. BLE callbacks only move bytes; framing and parsing happen on the main loop so the host task never starves. Pairs with the espble macOS central. Requires NimBLE-Arduino 1.4.x.
category=Communication
url=https://github.com/konder/esp-ble-link
architectures=esp32
depends=NimBLE-Arduino
includes=EspBleLink.h,EspBleOta.h
