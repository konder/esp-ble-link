; esp-ble-link 回环示例 —— 收什么回什么,外加一条 ota 指令。
;
; 这个示例存在的意义是**把框架端到端跑通一遍**:烧进任意一块 ESP32-S3,
; 主机侧 `espble send '{"hi":1}'` 应该立刻收到回显。新设备接入前先拿它验环境。
;
;   pio run                       # 编译全部 env
;   pio run -e esp32s3 -t upload  # 烧通用 S3 开发板
;   pio run -e stamps3 -t upload  # 烧 M5 StampS3 / Cardputer
;
; 库的引用方式:仓库内示例用 symlink 指向仓库根;
; 你自己的项目里请写 lib_deps = https://github.com/konder/esp-ble-link.git

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200

lib_deps =
  symlink://../..

build_flags =
  -DCORE_DEBUG_LEVEL=3
  ; 固件版本号。OTA 时远端 /fw/version 大于这个值才会升级。
  -DFW_VERSION=1
  ; BLE 广播名。中枢默认按精确名匹配,同一张桌子上多台设备就靠它区分。
  '-DECHO_DEVICE_NAME="EspBleEcho"'
  ; 下面三个留空则示例跳过 OTA 分支(纯 BLE 回环也能验)。
  ; 要验 OTA 就填成你跑 `espble ota serve` 那台机器。
  '-DOTA_HOST=""'
  '-DWIFI_SSID=""'
  '-DWIFI_PASSWORD=""'

[env:esp32s3]
board = esp32-s3-devkitm-1
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1

[env:stamps3]
; M5 StampS3(Cardputer 的核心板)
board = m5stack-stamps3
